<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PETEY - Authorize Bot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=22">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: var(--bg-primary);
            color: var(--text-normal);
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
        }
        .standalone-topbar {
            background-color: var(--bg-secondary);
            height: var(--topbar-h);
            display: flex;
            align-items: center;
            padding: 0 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }
        .main-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .auth-card {
            background-color: var(--bg-secondary);
            border-radius: 8px;
            padding: 32px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center;
        }
        .bot-icon {
            font-size: 3rem;
            margin-bottom: 16px;
            display: block;
        }
        .auth-title {
            color: var(--text-header);
            margin-bottom: 8px;
            font-size: 1.5rem;
            font-weight: 600;
        }
        .auth-subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .form-group {
            text-align: left;
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        .input-styled {
            width: 100%;
            padding: 10px 12px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-tertiary);
            color: var(--text-normal);
            box-sizing: border-box;
            font-family: inherit;
        }
        .input-code {
            font-family: monospace;
            font-size: 1.5rem;
            letter-spacing: 0.3em;
            text-align: center;
            text-transform: uppercase;
            padding: 12px;
        }
        .input-styled:focus {
            outline: none;
            border-color: #5865f2;
        }
        .auth-btn {
            background-color: #5865f2;
            color: white;
            padding: 10px 16px;
            border-radius: 4px;
            border: none;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            transition: background-color 0.2s;
            margin-top: 8px;
        }
        .auth-btn:hover { background-color: #4752c4; }
        .error-msg {
            background-color: #da373c;
            color: white;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            text-align: left;
        }
        .auth-back {
            color: #00a8fc;
            text-decoration: none;
            font-size: 0.85rem;
            display: block;
            margin-top: 16px;
        }
        .auth-back:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <header class="standalone-topbar">
        <div class="logo" style="margin: 0;">PETEY<span>_CONTROL</span></div>
    </header>
    
    <div class="main-container">
        <div class="auth-card">
            <span class="bot-icon">🤖</span>
            <h2 class="auth-title">Verify Access</h2>
            {% if email %}
                <div class="auth-subtitle">We sent a 6-digit access code to <strong style="color: #00a8fc;">{{ email }}</strong>.</div>
            {% else %}
                <div class="auth-subtitle">Please enter your verified email and access code to continue.</div>
            {% endif %}
            
            {% if error %}
            <div class="error-msg">{{ error }}</div>
            {% endif %}
            
            <form method="POST" action="/add_bot/{{ server_id }}/verify">
                <div class="form-group">
                    <label for="email" style="text-align: center;">VERIFIED EMAIL <span style="color: #da373c;">*</span></label>
                    <input class="input-styled" style="text-align: center; font-size: 1.1rem; color: #b5bac1;" type="email" id="email" name="email" value="{{ email if email else '' }}" autocomplete="off" required>
                </div>
                <div class="form-group">
                    <label for="code" style="text-align: center;">ENTER 6-DIGIT CODE <span style="color: #da373c;">*</span></label>
                    <input class="input-styled input-code" type="text" id="code" name="code" maxlength="6" autocomplete="off" placeholder="XXXXXX" required>
                </div>
                <button type="submit" class="auth-btn" style="margin-top: 8px;" onclick="this.innerHTML='Verifying...'; this.style.opacity='0.8';">Add PETEY to Server</button>
            </form>
            <a href="/add_bot/{{ server_id }}" class="auth-back">← Request a new code</a>
        </div>
    </div>
</body>
</html>
